# 每日 7:30 北京时间拉取 AI 动态（arXiv + RSS），生成 public/ai-daily/YYYY-MM-DD.json
name: AI Daily

permissions:
  contents: write

on:
  schedule:
    # 7:30 北京时间 = 23:30 UTC（前一天）
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  ai-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fetch AI daily (arXiv + RSS) and push
        env:
          TZ: Asia/Shanghai
        run: |
          TARGET_DATE=$(date -d 'yesterday' +%Y-%m-%d)
          echo "Target date: $TARGET_DATE"
          pnpm run ai-daily "$TARGET_DATE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ai-daily/*.json
          git diff --staged --quiet || (git commit -m "chore(ai-daily): update $TARGET_DATE" && git push)
